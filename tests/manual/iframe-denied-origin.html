<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BibleQuest denied-origin iframe check</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
      iframe { border: 1px solid #888; height: 70vh; width: 100%; }
    </style>
  </head>
  <body>
    <h1>Denied-origin iframe check</h1>
    <p>
      Serve this fixture from a controlled HTTPS origin that is not on the
      ancestor allowlist. Pass the release-candidate URL as
      <code>?target=https%3A%2F%2Fexample.test</code>. BibleQuest must refuse to
      render below while continuing to open directly.
    </p>
    <p id="target"></p>
    <iframe id="frame" title="BibleQuest denied-origin check"></iframe>
    <script>
      // Accept only BibleQuest release hosts or the local development target.
      function approvedTarget(value) {
        if (!value) return new URL("http://localhost:3000/");
        try {
          const url = new URL(value);
          const canonicalHosts = [
            "biblequest.co",
            "www.biblequest.co",
            "console.biblequest.co",
          ];
          const previewHost =
            /^bible-quest-[a-z0-9-]+-winterhill\.vercel\.app$/.test(
              url.hostname,
            );
          const localHost =
            url.protocol === "http:" &&
            url.hostname === "localhost" &&
            url.port === "3000";
          const deployedHost =
            url.protocol === "https:" &&
            (canonicalHosts.includes(url.hostname) || previewHost);
          if (
            url.username ||
            url.password ||
            (!localHost && !deployedHost)
          ) {
            return null;
          }
          return url;
        } catch {
          return null;
        }
      }

      const candidate = new URLSearchParams(window.location.search).get("target");
      const target = approvedTarget(candidate);
      const targetLabel = document.querySelector("#target");
      const frame = document.querySelector("#frame");
      if (target) {
        targetLabel.textContent = `Target: ${target.href}`;
        frame.src = target.href;
      } else {
        targetLabel.textContent = "Rejected: target is not an approved BibleQuest host.";
        frame.removeAttribute("src");
      }
    </script>
  </body>
</html>
