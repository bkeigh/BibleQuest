name: Daily synthetic health

on:
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-synthetic-health
  cancel-in-progress: false

jobs:
  monitor:
    name: Read-only production monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BIBLEQUEST_MONITOR_SUPABASE_URL: ${{ secrets.BIBLEQUEST_MONITOR_SUPABASE_URL }}
      BIBLEQUEST_MONITOR_SUPABASE_ANON_KEY: ${{ secrets.BIBLEQUEST_MONITOR_SUPABASE_ANON_KEY }}
      # Every expectation is derived from this checkout, never from repository
      # variables. Those variables were pinned by hand on 2026-07-27 and then
      # went stale, so the monitor spent days comparing production against a
      # months-old release and reporting a failure nobody could act on. A
      # monitor whose expectations need manual upkeep stops being a monitor.
      #
      # The SHA is the commit being tested — on the scheduled run, main's tip —
      # so production serving anything else is deploy drift by definition. The
      # contract versions fall back to config/observability.json, which is
      # version-controlled and moves with the code that changes them.
      BIBLEQUEST_MONITOR_EXPECTED_SHA: ${{ github.sha }}
      BIBLEQUEST_MONITOR_EXPECTED_AUTH_POSTURE: configured
      # Stripe Live shipped in #54/#55, so the monitor now guards the launched
      # posture. These stay explicit rather than defaulted: a silent flip back
      # to coming-soon, or purchases switching off, must fail this check.
      BIBLEQUEST_MONITOR_EXPECTED_BILLING_MODE: live
      BIBLEQUEST_MONITOR_EXPECTED_BILLING_PURCHASES_ENABLED: "true"
      BIBLEQUEST_MONITOR_EXPECTED_BILLING_SUPPORT_ENABLED: "true"
      BIBLEQUEST_MONITOR_VERCEL_PROJECT_ID: ${{ secrets.BIBLEQUEST_MONITOR_VERCEL_PROJECT_ID }}
      BIBLEQUEST_MONITOR_VERCEL_TEAM_ID: ${{ secrets.BIBLEQUEST_MONITOR_VERCEL_TEAM_ID }}
      BIBLEQUEST_MONITOR_VERCEL_TOKEN: ${{ secrets.BIBLEQUEST_MONITOR_VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Run bounded synthetic checks
        id: synthetic
        continue-on-error: true
        run: node scripts/run-synthetic-health.mjs
      - name: Archive sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-health-${{ github.run_id }}
          path: artifacts/synthetic-health/
          if-no-files-found: error
          retention-days: 14
      - name: Deduplicate failure or recovery issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-synthetic-health-issue.mjs
      - name: Preserve failing workflow status
        if: steps.synthetic.outcome != 'success'
        run: exit 1
