name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: UTC

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Verify generated Console seed
        run: pnpm check:seed
      - name: Check changed lines for whitespace errors
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            echo "::notice::Base commit unavailable; checking the current commit."
            git diff --check HEAD^ HEAD
          fi
          git diff --check

  types-and-tests:
    name: Types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Run noninteractive tests
        run: pnpm test
      - name: Verify sanitized launch evidence command
        run: pnpm test:launch-evidence

  production-build:
    name: Production build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: guest
            supabase_url: ""
            supabase_key: ""
            account_sync_enabled: "false"
            billing_mode: coming-soon
            billing_key: ""
          # Browser-safe fixtures exercise the configured-auth bundle without
          # contacting Supabase or requiring repository secrets.
          - mode: configured-auth-contained
            supabase_url: https://header-fixture.supabase.co
            supabase_key: header-fixture-anon-key
            account_sync_enabled: "false"
            billing_mode: live
            billing_key: rcb_headerfixture
          # Compile the release posture too; fake browser-safe values never
          # contact Supabase during the build.
          - mode: configured-auth-enabled
            supabase_url: https://header-fixture.supabase.co
            supabase_key: header-fixture-anon-key
            account_sync_enabled: "true"
            billing_mode: coming-soon
            billing_key: ""
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.supabase_url }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ matrix.supabase_key }}
      NEXT_PUBLIC_ACCOUNT_SYNC_ENABLED: ${{ matrix.account_sync_enabled }}
      NEXT_PUBLIC_REVENUECAT_BILLING_MODE: ${{ matrix.billing_mode }}
      NEXT_PUBLIC_REVENUECAT_PUBLIC_KEY: ${{ matrix.billing_key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.mode }} bundle
        run: pnpm build
      - name: Exercise production and development security headers
        if: matrix.mode == 'configured-auth-contained'
        run: pnpm test:headers:built

  dependency-risk:
    name: Dependency risk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Report all production advisories
        continue-on-error: true
        run: pnpm audit --prod
      - name: Block high and critical production risk
        run: pnpm audit --prod --audit-level high
