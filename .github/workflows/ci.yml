name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: UTC

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Verify generated Console seed
        run: pnpm check:seed
      - name: Check changed lines for whitespace errors
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            echo "::notice::Base commit unavailable; checking the current commit."
            git diff --check HEAD^ HEAD
          fi
          git diff --check

  types-and-tests:
    name: Types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Run noninteractive tests
        run: pnpm test
      - name: Verify sanitized launch evidence command
        run: pnpm test:launch-evidence

  production-build:
    name: Production build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: guest
            supabase_url: ""
            supabase_key: ""
            account_sync_enabled: "false"
          # Browser-safe fixtures exercise the configured-auth bundle without
          # contacting Supabase or requiring repository secrets.
          - mode: configured-auth-contained
            supabase_url: https://header-fixture.supabase.co
            supabase_key: header-fixture-anon-key
            account_sync_enabled: "false"
          # Compile the release posture too; fake browser-safe values never
          # contact Supabase during the build.
          - mode: configured-auth-enabled
            supabase_url: https://header-fixture.supabase.co
            supabase_key: header-fixture-anon-key
            account_sync_enabled: "true"
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.supabase_url }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ matrix.supabase_key }}
      NEXT_PUBLIC_ACCOUNT_SYNC_ENABLED: ${{ matrix.account_sync_enabled }}
      # Every CI bundle exercises the safe production default. Direct Stripe
      # test/live configuration belongs only in encrypted environments.
      STRIPE_BILLING_MODE: coming-soon
      BIBLEQUEST_STRIPE_PURCHASES_ENABLED: "false"
      BIBLEQUEST_STRIPE_SUPPORT_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.mode }} bundle
        run: pnpm build
      - name: Verify configured auth browser bundle
        if: matrix.mode != 'guest'
        run: pnpm check:supabase-browser-bundle
      - name: Exercise production and development security headers
        if: matrix.mode == 'configured-auth-contained'
        run: pnpm test:headers:built

  native-export:
    name: Native release export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the pinned guest-only native bundle
        run: pnpm build:native:release

  ios-simulator-build:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare the release bundle and native plugins
        run: pnpm ios:release:prepare
      - name: Validate Capacitor and Apple configuration
        run: |
          pnpm exec cap doctor
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy ios/App/App/App.entitlements
      - name: Compile the unsigned iOS simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/BibleQuestDerivedData"
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          build

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise browser release paths
        run: pnpm test:e2e

  database-policies:
    name: Database policies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1
      - name: Start credential-free local Supabase
        run: supabase start
      - name: Apply migrations and seed from a clean database
        run: supabase db reset
      - name: Run schema and RLS acceptance tests
        run: supabase test db --local
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  dependency-risk:
    name: Dependency risk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Report all dependency advisories
        continue-on-error: true
        run: pnpm audit
      - name: Block high and critical dependency risk
        run: pnpm audit --audit-level high
