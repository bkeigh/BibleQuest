packages:
  - .
# Installs the Linux x64 Sharp runtime beside the local platform so Vercel can
# package both the native addon and its matching libvips shared library.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc
allowBuilds:
  sharp: true
  unrs-resolver: true
verifyDepsBeforeRun: false
overrides:
  # Pin the complete source-map path validation fix (GHSA-fxqj-rqcc-2cmp).
  postcss: 8.5.23
  # Keep Next's optional image runtime on the audited libvips build.
  next>sharp: 0.35.3
  # Collapse legacy minimatch callers onto the patched brace parser.
  brace-expansion: 5.0.9
minimumReleaseAgeExclude:
  # Allow the fresh upstream patches that address brace-expansion advisories.
  - brace-expansion@5.0.9
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
