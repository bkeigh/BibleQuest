packages:
  - .
# Installs the Linux x64 Sharp runtime beside the local platform so Vercel can
# package both the native addon and its matching libvips shared library.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc
allowBuilds:
  sharp: true
  unrs-resolver: true
verifyDepsBeforeRun: false
overrides:
  # Capacitor's xcode helper only calls uuid.v4(), whose CommonJS API remains
  # compatible; move it past the vulnerable buffered v3/v5/v6 implementation.
  xcode>uuid: 11.1.1
  # Pin the complete source-map path validation fix (GHSA-fxqj-rqcc-2cmp).
  postcss: 8.5.23
  # Keep Next's optional image runtime on the audited libvips build.
  next>sharp: 0.35.3
  # Collapse legacy minimatch callers onto the patched brace parser.
  brace-expansion: 5.0.9
  # postcss ships nanoid 3.3.16, where a custom generator can loop forever on
  # a zero size (GHSA-2v37-7h3g-55p8). Reached only through next>postcss, so
  # nothing here calls it directly — pinned anyway to keep the production
  # audit clean.
  nanoid: 3.3.18
minimumReleaseAgeExclude:
  # Allow the fresh upstream patches that address brace-expansion advisories.
  - brace-expansion@5.0.9
  - nanoid@3.3.18
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
